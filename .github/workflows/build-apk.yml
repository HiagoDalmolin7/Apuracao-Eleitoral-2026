name: Gerar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 37.2
        run: |
          sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Configurar Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v7
        with:
          name: ApuracaoEleitoral-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
