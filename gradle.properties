# Android Gradle Plugin 9 + Gradle 9.8.2
android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official

# Caches separados: Build Cache e Configuration Cache.
org.gradle.caching=true
org.gradle.configuration-cache=true
# Usar modo estrito: não ignorar erros de cache por meio de problems=warn.
